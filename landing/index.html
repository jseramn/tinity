<h1>Tinity</h1>
<p>Tinity is an agentic systems engineering framework designed to build a harness-of-harnesses infrastructure for AI testing and evaluation. MIT license. The vision is not to replace or drive any other harness out of the market. Tinity exists to be a friend to all, to work alongside other harnesses and orchestrate them, putting advanced tools in creative developers' hands. Layer 8 will be agent-based.</p>
<ul><li>Version: 0.1.0</li><li>Repository: https://github.com/jseramn/tinity</li><li>License: MIT</li><li>Production path: https://tinity.jseramn.tech/</li></ul>
<h2>What runs today</h2>
<p>Slice · Status</p>
<p>Marketing landing (Vite React 19, lattice Stage) · shipped</p>
<p>cursor-gateway v0.1.0 (localhost OpenAI-compat wrap around cursor-agent) · shipped</p>
<p>Connector pattern library · shipped (library only, no live Slack)</p>
<p>OpenClaw ↔ Hermes contract · in design</p>
<p>Policy layer 2.1 (rules, SQLite audit, CLI) · next</p>
<p>Harness adoption over Slack · next</p>
<p>Layer 8 (runtimes, sandboxes, fleets) · later</p>
<p>There is not yet an in-tree sandbox controller or fleet scheduler.</p>
